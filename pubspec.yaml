name: easy_app
description: "Easy App - The Official Super App owned by Republic Nepal TV & Advertising Pvt. Ltd."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Reactive DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Declarative Routing
  go_router: ^14.0.1

  # Backend, PostgreSQL & RLS Auth
  supabase_flutter: ^2.5.6

  # Utilities & Design System
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
