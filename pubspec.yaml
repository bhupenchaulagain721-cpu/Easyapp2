name: easy_app
description: "Easy App - The Official Super App owned by Republic Nepal TV & Advertising Pvt. Ltd."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Reactive DI
  flutter_riverpod: ^2.5.1

  # Declarative Routing
  go_router: ^14.0.1

  # Backend, PostgreSQL & RLS Auth
